<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heroes of the Storm maps</title>
    <style>
      :root {
        --backdrop: #202024;
        --text: #e8e8ec;
        --card: #2c2c32;
        --accent: #8fb4ff;
      }
      body {
        margin: 0;
        padding: 24px 16px;
        background: var(--backdrop);
        color: var(--text);
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 20px;
        opacity: 0.8;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
      }
      a {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px;
        border-radius: 10px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
      }
      a:hover span,
      a:focus-visible span {
        color: var(--accent);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      img {
        width: 100%;
        height: auto;
        border-radius: 6px;
        background: #303036;
      }
      span {
        font-weight: 600;
      }
      small {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Heroes of the Storm maps</h1>
      <p id="status">
        Rendered from the game by heroes-capture. Choose a map: drag to pan, mouse wheel to zoom.
      </p>
      <ul id="maps"></ul>
    </main>
    <script type="module">
      // The list comes from the catalog (maps/index.json), so this page never changes when maps do.
      const list = document.getElementById('maps');
      try {
        const response = await fetch('maps/index.json');
        if (!response.ok) throw new Error(`maps/index.json: ${response.status}`);
        const { maps } = await response.json();
        for (const map of maps) {
          const link = document.createElement('a');
          link.href = `maps/${map.path}`;
          if (map.thumbnail) {
            const picture = document.createElement('img');
            picture.src = `maps/${map.thumbnail.file}`;
            [picture.width, picture.height] = map.thumbnail.size;
            picture.alt = '';
            link.append(picture);
          }
          const name = document.createElement('span');
          name.textContent = map.name;
          const details = document.createElement('small');
          details.textContent = `${map.category ?? ''} · game build ${map.gameBuild}`;
          link.append(name, details);
          const item = document.createElement('li');
          item.append(link);
          list.append(item);
        }
      } catch (error) {
        document.getElementById('status').textContent =
          `The map list could not be loaded (${error.message}).`;
      }
    </script>
  </body>
</html>
